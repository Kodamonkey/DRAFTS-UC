# ==============================================================================
# ADVANCED MODEL CONFIGURATION
# ==============================================================================
#
# Which neural-network weights the pipeline loads, and under what name.
#
# Every key in this file is READ. That was not true before: this file used to
# carry 177 lines describing architectures, inference batching, detection
# post-processing, weight-integrity checks, TensorRT, ONNX and quantization,
# and `user_config.py` loaded all of it into a dictionary that nothing ever
# looked at (audit P2-29, REF-07). An operator tuning a threshold here was
# tuning nothing.
#
# The keys that went away, and why -- so the decision is not re-litigated:
#
#   architecture.*.input_size,          The sizes are fixed by the weights and
#   input_channels, num_classes,        by the code: detection works in a
#   head_conv, dropout_rate,            512x512 frame (`CNN_IMG_SIZE`) and the
#   max_detections                      classifier head is binary, which
#                                       `classify_patch` assumes when it reads
#                                       `softmax(dim=1)[0, 1]`. The
#                                       classification `input_size` said
#                                       [224, 224], which was simply wrong.
#                                       These are training-time choices baked
#                                       into the .pth; a runtime file cannot
#                                       change them and should not pretend to.
#
#   inference.batch_size,               Declared here AND in performance.yaml.
#   use_mixed_precision, and the        Two files describing one setting is how
#   rest of the inference block         they end up disagreeing (audit P2-27
#                                       is that bug for prewhitening).
#                                       performance.yaml owns performance.
#
#   inference.device.prefer_*           `config.DEVICE` is chosen by probing
#                                       the machine, which is the right way
#                                       round: a preference for CUDA on a host
#                                       without CUDA is not a preference.
#
#   detection_model.nms_threshold,      `centernet_utils.get_res` takes one
#   heatmap_threshold, peak_threshold,  threshold, `confidence`, and nothing
#   gaussian_*                          else. The others had no place to go.
#
#   detection_model.confidence_threshold  Duplicated `detection.det_prob` in
#   classification_model.burst_threshold  config.yaml, which IS read. Removed
#                                         here so there is one answer.
#
#   classification_model.enable_tta,    No implementation exists for any of
#   ensemble, validation.check_*,       them. `check_weights_integrity: true`
#   benchmark_*, logging.*,             was the worst of the set: there is no
#   experimental.*                      reference checksum in the repository,
#                                       so it promised an integrity check that
#                                       could not be performed (audit P2-37).
#
# If one of those is wanted, implement it first and then add the key back. A
# key that describes an intention rather than a behaviour is worse than no key.
# ==============================================================================

# =============================================================================
# MODEL FILES
# =============================================================================
paths:
  # Directory holding the .pth weights, relative to the `src/` package.
  model_dir: "models"

  # Weight files inside `model_dir`. Leave a value empty to fall back to the
  # conventional name, `cent_<detection_name>.pth` / `class_<classification_name>.pth`.
  detection_model: "cent_resnet18.pth"
  classification_model: "class_resnet18.pth"

# =============================================================================
# ARCHITECTURE
# =============================================================================
# The backbone name is passed to `centernet(model_name=...)` and
# `BinaryNet(...)`, so it must match the architecture the weights were trained
# with. Changing it without changing the weights fails at load_state_dict.
architecture:
  detection:
    name: "resnet18"
  classification:
    name: "resnet18"
