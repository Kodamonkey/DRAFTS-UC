# Docker Compose for DRAFTS-UC

# ==============================================================================
# DRAFTS-UC Pipeline - Docker Compose
# ==============================================================================
# This file defines services to run the pipeline on CPU or GPU
#
# IMPORTANT: Configure the pipeline by editing config.yaml before running
#
# Usage:
#   - CPU:  docker-compose run --rm drafts-cpu
#   - GPU:  docker-compose run --rm drafts-gpu
#
# Build:
#   - CPU:  docker-compose build drafts-cpu
#   - GPU:  docker-compose build drafts-gpu
#
# The pipeline reads configuration from config.yaml (mounted as volume)
# ==============================================================================

services:
  # ============================================================================
  # CPU Service - For systems without NVIDIA GPU
  # ============================================================================
  drafts-cpu:
    build:
      context: .
      dockerfile: Dockerfile
      target: cpu-final
    image: drafts-uc:cpu-latest
    container_name: drafts-uc-cpu
    
    # Volumes for data, results, models and configuration
    volumes:
      # Pipeline configuration. Read-only: nothing in the pipeline writes it,
      # so there is no reason for a container to be able to rewrite the host's
      # configuration.
      - ./config.yaml:/app/config.yaml:ro
      
      # Input data (read-only). Set DRAFTS_DATA_DIR in a .env file or in the
      # environment; compose fails with the message below if it is missing,
      # instead of silently creating a directory named after a sample path.
      - ${DRAFTS_DATA_DIR:?set DRAFTS_DATA_DIR to the directory holding your .fits/.fil files}:/app/Data/raw:ro
      
      # Results (read-write)
      - ./Results:/app/Results:rw
      
      # Pre-trained models (read-only) - where code looks for them
      - ./src/models:/app/src/models:ro
      
      # Logs. Mounted by default: the documented way to run this is
      # `docker compose run --rm`, which used to take the whole run's log with
      # the container.
      - ./logs:/app/logs:rw
      
      # Optional: temporary processed data
      # - ./Data/processed:/app/Data/processed:rw
    
    # Environment variables (auto-detected at runtime by hardware_profile)
    environment:
      - PYTHONUNBUFFERED=1
      - DRAFTS_LOG_DIR=/app/logs
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-0}
      - MKL_NUM_THREADS=${MKL_NUM_THREADS:-0}
      - NUMBA_NUM_THREADS=${NUMBA_NUM_THREADS:-0}

    # Resource limits (override via env vars for different hosts)
    deploy:
      resources:
        limits:
          cpus: '${DRAFTS_CPU_LIMIT:-8}'
          memory: ${DRAFTS_MEM_LIMIT:-16G}
        reservations:
          cpus: '${DRAFTS_CPU_RESERVE:-4}'
          memory: ${DRAFTS_MEM_RESERVE:-8G}
    
    # Network
    network_mode: bridge
    
    # Restart policy
    restart: "no"
    
    # User
    user: "1000:1000"

  # ============================================================================
  # GPU Service - For systems with NVIDIA GPU + CUDA
  # ============================================================================
  drafts-gpu:
    build:
      context: .
      dockerfile: Dockerfile
      target: gpu-final
    image: drafts-uc:gpu-latest
    container_name: drafts-uc-gpu
    
    # NVIDIA runtime for GPU access
    runtime: nvidia
    
    # Volumes for data, results, models and configuration
    volumes:
      # Pipeline configuration. Read-only: nothing in the pipeline writes it,
      # so there is no reason for a container to be able to rewrite the host's
      # configuration.
      - ./config.yaml:/app/config.yaml:ro
      
      # Input data (read-only). Set DRAFTS_DATA_DIR in a .env file or in the
      # environment; compose fails with the message below if it is missing,
      # instead of silently creating a directory named after a sample path.
      - ${DRAFTS_DATA_DIR:?set DRAFTS_DATA_DIR to the directory holding your .fits/.fil files}:/app/Data/raw:ro
      
      # Results (read-write)
      - ./Results:/app/Results:rw
      
      # Pre-trained models (read-only) - where code looks for them
      - ./src/models:/app/src/models:ro
      
      # Logs. Mounted by default: the documented way to run this is
      # `docker compose run --rm`, which used to take the whole run's log with
      # the container.
      - ./logs:/app/logs:rw
      
      # Optional: temporary processed data
      # - ./Data/processed:/app/Data/processed:rw
    
    # Environment variables for GPU
    environment:
      - PYTHONUNBUFFERED=1
      - DRAFTS_LOG_DIR=/app/logs
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - CUDA_VISIBLE_DEVICES=0
    
    # Resource limits (override via env vars for different hosts)
    deploy:
      resources:
        limits:
          cpus: '${DRAFTS_CPU_LIMIT:-8}'
          memory: ${DRAFTS_MEM_LIMIT_GPU:-32G}
        reservations:
          cpus: '${DRAFTS_CPU_RESERVE:-4}'
          memory: ${DRAFTS_MEM_RESERVE_GPU:-16G}
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
    # Network
    network_mode: bridge
    
    # Restart policy
    restart: "no"
    
    # User
    user: "1000:1000"

# ==============================================================================
# Named volumes (optional)
# ==============================================================================
# Uncomment if you prefer using named volumes instead of bind mounts
# volumes:
#   drafts-data:
#     driver: local
#   drafts-results:
#     driver: local
#   drafts-models:
#     driver: local

