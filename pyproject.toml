[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drafts-uc"
version = "0.1.0"
description = "DRAFTS FRB detection pipeline (audited)"
requires-python = ">=3.11"
# Lower bounds = tested baseline; major ceilings guard against breaking releases.
# For an exact, reproducible install (incl. transitives + hashes) use requirements.lock.txt.
dependencies = [
    "astropy>=7.2,<8",
    "opencv-python>=4.13,<5",
    "matplotlib>=3.10,<4",
    "numba>=0.65,<0.66",
    "numpy>=2.4,<3",
    "pandas>=2.3,<3",
    "psutil>=7.1,<8",
    "pyyaml>=6.0,<7",
    "scipy>=1.17,<2",
    "seaborn>=0.13,<0.14",
    "scikit-image>=0.26,<0.27",
    "scikit-learn>=1.8,<2",
    "timm>=1.0,<2",
    "torch>=2.11,<3",
    "torchvision>=0.26,<0.27",
    "tqdm>=4.67,<5",
    "your>=0.6,<0.7",
    "blimpy>=2.0,<3",
    "jplephem>=2.24,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
]

[tool.setuptools.packages.find]
# src-layout with main.py/tests/ at root: scope discovery to the src package
# so editable installs don't trip on multiple top-level dirs.
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
norecursedirs = ["mutation", ".git", "__pycache__"]
# Fast PR suite: physics, parity, contracts, audit fixes, YAML, smoke.
addopts = "-q"
filterwarnings = [
    "ignore::pytest.PytestReturnNotNoneWarning",
]

[tool.mutmut]
# Mutation testing on architecture/physics-critical, mostly-pure modules.
paths_to_mutate = [
    "src/analysis/science_metrics.py",
    "src/core/pipeline_parameters.py",
    "src/preprocessing/dm_candidate_extractor.py",
    "src/input/utils.py",
]
tests_dir = ["tests/"]
